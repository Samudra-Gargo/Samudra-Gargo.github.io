name: get-photos-2
on:
  push:
    paths: ['.github/workflows/get-photos-2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and resize
        run: |
          set -e
          mkdir -p photos
          while read -r name url; do
            curl -fsSL -A "Mozilla/5.0" -o "photos/$name.jpg" "$url"
            ls -l "photos/$name.jpg"
          done <<'LIST'
          plc-tia-portal https://media.licdn.com/dms/image/v2/D5622AQFheos_aUGKuA/feedshare-image-high-res/B56aEALd7ZIQAU-/0/1791004368883?e=1796860800&v=beta&t=k8DPSIHrnB49AXhJ5rmtvrmhcLpnhuqX2tyIqwm572o
          cert-siemens-plc https://media.licdn.com/dms/image/v2/D562DAQFzhNqLvh8qKQ/profile-treasury-document-cover-images_480/B56aC85M58KMA0-/0/1789875508660?e=1795842000&v=beta&t=1O6pbDD9gAt1e-6UAg514gD06pwaI46dktrRO_WA6N8
          cert-bim https://media.licdn.com/dms/image/v2/D562DAQHALfMhgaDZmQ/profile-treasury-document-cover-images_480/B56aFS22WpJwA4-/0/1792391473603?e=1795842000&v=beta&t=Pa0vden7w9DtB98Wg3PMZCGDjOrd8VL95J_oOki38nk
          cert-six-sigma https://media.licdn.com/dms/image/v2/D562DAQEi0MowMyo36A/profile-treasury-document-cover-images_480/B56aC7zgW5HkA4-/0/1789857237420?e=1795842000&v=beta&t=RsJiCdU3bUzDwYEzax9HAEqXCwQdIPYryLMgq7Xt_5o
          cert-robotics-electronics https://media.licdn.com/dms/image/v2/D4E2DAQEyEd72TN0n6w/profile-treasury-document-cover-images_480/B4EaCD67LAH8A4-/0/1788919657906?e=1795842000&v=beta&t=w_zSa_uUv3Vs36uP5KC84Cp1WYbVutXYMhH7BV4MrZA
          cert-arm-cortex-m https://media.licdn.com/dms/image/v2/D4E2DAQFh2muj5FMucA/profile-treasury-document-cover-images_480/B4EaCD5NNdIUA8-/0/1788919207568?e=1795842000&v=beta&t=x92DlUipfce3vbh-JLM1WcLcCsDcwiYOXYxVlh0A0Ks
